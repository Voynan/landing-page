name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Vitest runs on Node even when it is started through Bun.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same gate used locally: typecheck, lint, format, Vitest, and the
      # Impeccable design detector, as declared in package.json.
      - name: Run the project check
        run: bun run check

      # Builds the client and server bundles and prerenders every public route,
      # which catches rendering and prerender regressions the tests cannot.
      # `bun run build` would also validate the release configuration, which
      # needs production-only variables that CI does not hold.
      - name: Build and prerender the site
        run: bun run build:app
