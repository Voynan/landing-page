AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Voynan landing page contact endpoint

Parameters:
  TurnstileSecret:
    Type: String
    NoEcho: true
    Description: Cloudflare Turnstile secret key.
  ContactFromAddress:
    Type: String
    Description: Verified sender address.
  ContactRecipients:
    Type: CommaDelimitedList
    Description: Fixed recipient list. Supplied at deploy time, never committed.
  AllowedOrigin:
    Type: String
    Description: The only origin permitted to call the endpoint.
  SesIdentityName:
    Type: String
    Default: voynan.com
    Description: The verified SES identity the function may send from.

Resources:
  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Bundled by `bun run build:contact` into build/, because SAM's esbuild
      # builder copies only CodeUri and so cannot reach the shared schema in
      # src/. Pointing CodeUri at the repository root instead would copy 554 MB
      # on every build.
      CodeUri: build/
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 10
      # ReservedConcurrentExecutions is deliberately absent. This account's
      # total concurrency limit is 10, the new-account default, and AWS refuses
      # any reservation that leaves fewer than 10 unreserved. That account limit
      # is itself a tighter cap than the 5 this function wanted, and this is the
      # only Lambda in the account. Restore `ReservedConcurrentExecutions: 5`
      # once the account limit is raised, or the cap disappears with it.
      Environment:
        Variables:
          TURNSTILE_SECRET: !Ref TurnstileSecret
          CONTACT_FROM_ADDRESS: !Ref ContactFromAddress
          CONTACT_RECIPIENTS: !Join [",", !Ref ContactRecipients]
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
          MaxAge: 3600
      Policies:
        # This policy restricts the sender identity, and deliberately nothing
        # else. Two condition keys were tried here and both had to go:
        #
        # ses:FromAddress is not populated by the v2 SendEmail call, and
        # StringEquals over an absent key denies, so it rejected every message
        # with AccessDeniedException.
        #
        # ses:Recipients is populated, but with more than the To list: the
        # visitor's Reply-To address appears in it. Since that address is
        # different on every submission and cannot be listed in advance,
        # ForAllValues:StringEquals denied every legitimate send. Confirmed
        # with `aws iam simulate-principal-policy`: the same role is `allowed`
        # for the two configured recipients and `implicitDeny` as soon as a
        # third address joins them.
        #
        # The recipient list is therefore enforced in the handler alone, where
        # it is read from configuration, validated as addresses, and never
        # taken from the request.
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesIdentityName}

Outputs:
  ContactEndpoint:
    Description: Value for VITE_CONTACT_ENDPOINT.
    Value: !GetAtt ContactFunctionUrl.FunctionUrl
